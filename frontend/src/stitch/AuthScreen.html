<body class="bg-vibrant font-body text-on-surface min-h-screen flex items-center justify-center p-6 selection:bg-primary/30">
<!-- Hero Background Element (Visual Texture) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-secondary/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Main Auth Container -->
<main class="w-full max-w-[440px] relative z-10">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-container flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(105,246,184,0.15)]">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="bubble_chart">bubble_chart</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tight bg-gradient-to-r from-on-surface to-on-surface-variant bg-clip-text text-transparent">
                Grocery Split
            </h1>
<p class="font-body text-on-surface-variant mt-2 text-sm">Curating shared expenses with precision.</p>
</div>
<!-- Glassmorphism Auth Card -->
<div class="glass-panel rounded-[2.5rem] p-8 md:p-10 border border-outline-variant/10 shadow-2xl">
<!-- Tab Switcher -->
<div class="flex p-1.5 bg-surface-container-lowest/40 rounded-full mb-10 relative">
<button class="flex-1 py-3 text-sm font-semibold text-on-primary-container bg-primary rounded-full transition-all duration-300">
                    Login
                </button>
<button class="flex-1 py-3 text-sm font-semibold text-on-surface-variant hover:text-on-surface transition-all duration-300">
                    Sign Up
                </button>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2 group">
<label class="block text-xs font-medium text-on-surface-variant px-1 tracking-wider uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-highest/30 border-0 rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/50 focus:bg-surface-container-highest/60 transition-all outline-none" id="email" placeholder="curator@grocerysplit.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2 group">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-medium text-on-surface-variant tracking-wider uppercase" for="password">Password</label>
<a class="text-[10px] font-semibold text-primary/70 hover:text-primary transition-colors tracking-tight" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-highest/30 border-0 rounded-2xl py-4 pl-12 pr-12 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/50 focus:bg-surface-container-highest/60 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 mt-4 bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-bold rounded-full shadow-[0_8px_24px_rgba(105,246,184,0.2)] hover:scale-[0.98] active:scale-95 transition-all duration-200">
                    Continue
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-outline-variant/10"></div>
</div>
<div class="relative flex justify-center">
<span class="px-4 bg-transparent text-[10px] font-bold text-on-surface-variant/40 tracking-[0.2em] uppercase">or connect with</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 py-4 bg-surface-container-high/40 hover:bg-surface-container-high/60 border border-outline-variant/10 rounded-full transition-all group">
<div class="w-5 h-5 flex items-center justify-center bg-white rounded-full p-0.5">

</div>
<span class="text-sm font-semibold text-on-surface group-hover:text-primary transition-colors">Login with Google</span>
</button>
</div>
<!-- Footer Info -->
<p class="text-center mt-10 text-[11px] text-on-surface-variant/50 leading-relaxed px-8">
