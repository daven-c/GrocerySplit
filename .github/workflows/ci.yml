name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Public values (the anon key is safe to expose; RLS protects the data). Only needed so the build type-checks.
      VITE_SUPABASE_URL: https://hibocxgjmvkiqdeojdfl.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_a0ipeYTQdnnqS4lKL_EsNw_yV3TKS-t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
